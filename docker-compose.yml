services:
  app:
    image: ghcr.io/allpynn/web-monitoring-tahfidz:latest
    container_name: laravel_app
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.75"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "8081:8000"
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000

  reverb:
    image: ghcr.io/allpynn/web-monitoring-tahfidz:latest
    container_name: laravel_reverb
    restart: always
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "8082:8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
